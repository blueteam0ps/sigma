title: ESXi removing bash history
id: 70fbd69a-dc5d-46f7-a1ea-f1801f2737d2
status: test
description: Detects a user deleting ash history on an ESXi host.
references:
    - https://labs.yarix.com/2025/01/zyxel-vulnerability-exploited-by-helldown-ransomware-group/
author: Janantha Marasinghe
date: 2025-01-26
tags:
    - attack.defense_evasion
    - attack.t1070.003
logsource:
    category: process_creation
    product: linux
detection:
    selection_img:
        Image|endswith: '/rm'
    selection_command:
        CommandLine|contains:
            - '-rf'
            - '.ash_history'
    condition: all of selection_*
falsepositives:
    - Not known
level: medium
